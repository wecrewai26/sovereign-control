[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-control"
version = "0.1.0"
description = "WeCrew AEGIS Sovereign Control: governance plane for autonomous operations agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["sovereign_control*"]

[tool.setuptools.package-data]
"sovereign_control.web" = ["*.html", "*.js", "*.css"]
